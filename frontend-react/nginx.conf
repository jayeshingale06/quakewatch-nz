server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A single page app has only one real HTML file. Any unknown
    # path must still serve it, so the app can handle the route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in every asset filename, so these
    # files can never change. Cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, or people keep getting the
    # old app after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
