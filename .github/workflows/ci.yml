name: CI

# Runs on every push to main, and on every pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: C# build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Testing the test project also builds the API project,
      # because the test project references it.
      - name: Run tests
        run: dotnet test backend/QuakeWatch.Api.Tests/QuakeWatch.Api.Tests.csproj --verbosity normal

  frontend:
    name: React typecheck, tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-react

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend-react/package-lock.json

      # npm ci installs the EXACT versions in package-lock.json.
      # Never use npm install in CI: it can quietly upgrade things.
      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # Build both images without pushing, purely to prove the
      # Dockerfiles are not broken.
      - name: Build the API image
        run: docker build -t quakewatch-api:ci ./backend/QuakeWatch.Api

      - name: Build the web image
        run: docker build -t quakewatch-web:ci ./frontend-react
